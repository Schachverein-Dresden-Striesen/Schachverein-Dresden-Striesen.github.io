[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schachverein-wiki"
version = "0.1.0"
description = "Tournament history preservation and analysis for Schachverein Dresden-Striesen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.46.0",
    "pandas>=3.0.5",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
minversion = "9.0"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]  # errors, warnings, undefined, isort
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__
