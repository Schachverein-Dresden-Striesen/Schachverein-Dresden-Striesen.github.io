# global settings
title: "Schachverein Dresden-Striesen e.V."
description: "Offizielle Website des Schachvereins Dresden-Striesen e.V. - Informationen zu Vereinsturnieren, Mannschaftskämpfen, Jugendarbeit und mehr."
# If you're hosting your site at a Project repository on GitHub pages 
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
# baseurl: ""
repository: "Schachverein-Dresden-Striesen"
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
email: info@sv-dresden-striesen.de
url: "https://www.sv-dresden-striesen.de"

author:
  name: "Schachverein Dresden-Striesen e.V."
  email: "info@sv-dresden-striesen.de"
  bio: "Traditionsreicher Schachverein in Dresden-Striesen mit über 100 Jahren Geschichte."
  location: "Dresden, Deutschland"

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:info@sv-dresden-striesen.de"

# Reading Files
include:
  - files
  - pages
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/Berlin

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-extlinks

# External links plugin configuration
extlinks:
  attributes: {target: _blank, rel: noopener noreferrer}
  rel_exclude: []

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-extlinks

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "main"
  # pages folder
  - scope:
      path: "pages"
      type: pages
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "main"
